
queueMode:
  enabled: true
  workerReplicaCount: 2
  workerConcurrency: 10

replicaCount: 1

ingress:
  enabled: true
  className: kong

  hosts:
    - host: ${n8n_hostname}
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: n8n-tls
      hosts:
        - ${n8n_hostname}

webhook:
  enabled: true
  url: https://${n8n_hostname}

resources:
  main:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  worker:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi


      
